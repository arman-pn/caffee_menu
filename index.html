<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>کافه قهوه</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Markazi+Text:wght@500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap">
<style>
/*
 * توکن‌های طراحی. طرح: «آرت‌دکوی شبانه» — مشکی گرم، خط‌های نازک طلایی و قوس‌های متحدالمرکز.
 * سایت عمداً فقط یک تم تیره دارد؛ برای تغییر رنگ‌ها همین فایل کافی است.
 */
:root {
  color-scheme: dark;

  /* زمینه‌ها، از تیره به روشن */
  --bg: #0a0907;
  --surface: #12100c;
  --raised: #1a1711;
  --line: #2e281c;

  /* متن */
  --ink: #efe6d2;
  --muted: #a59b84;

  /* طلا */
  --gold: #d4af6a;
  --gold-hi: #f6e3a8;
  --gold-lo: #9a7634;
  --gold-soft: rgb(212 175 106 / .12);
  --gold-foil: linear-gradient(120deg, #9a7634 0%, #f6e3a8 28%, #d4af6a 52%, #9a7634 78%, #f0d590 100%);
  --on-gold: #140f05;

  /* رنگ‌های وضعیت؛ جدا از طلا تا «هشدار» با «تزئین» اشتباه نشود */
  --ok: #6fcf97;
  --warn: #f0b44c;
  --bad: #f0786a;
  --info: #7fb8e6;
  --ok-soft: rgb(111 207 151 / .13);
  --warn-soft: rgb(240 180 76 / .14);
  --bad-soft: rgb(240 120 106 / .14);
  --info-soft: rgb(127 184 230 / .14);

  /* فیش کاغذی همیشه روشن است */
  --paper: #fffef9;
  --paper-ink: #1c1c1a;
  --scrim: rgb(0 0 0 / .72);

  /* تایپ */
  --f-display: 'Markazi Text', 'Vazirmatn', Tahoma, serif;
  --f-body: 'Vazirmatn', Tahoma, 'Segoe UI', sans-serif;
  --f-latin: 'Cinzel', 'Trajan Pro', 'Times New Roman', serif;

  --radius: 4px;
  --shadow: 0 2px 4px rgb(0 0 0 / .4), 0 18px 48px rgb(0 0 0 / .55);
  --glow: 0 0 0 1px rgb(212 175 106 / .35), 0 10px 40px rgb(212 175 106 / .14);
  --ease: cubic-bezier(.2, .7, .2, 1);
  --header-height: 68px;
}

/* پایه: تایپوگرافی، دکمه‌ها، فرم‌ها، برچسب‌ها و لایه‌های روی صفحه (کشو، پنجره، پیام). */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background:
    radial-gradient(1200px 520px at 80% -10%, rgb(212 175 106 / .09), transparent 70%),
    repeating-linear-gradient(135deg, rgb(212 175 106 / .022) 0 1px, transparent 1px 14px),
    var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.8;
  direction: rtl;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; line-height: 1.15; text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
small { font-size: .78em; font-weight: 400; opacity: .75; }
:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
::selection { background: var(--gold); color: var(--on-gold); }

.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.wrap { max-width: 1180px; margin-inline: auto; padding-inline: 20px; }
.latin { font-family: var(--f-latin); letter-spacing: .26em; text-transform: uppercase; font-size: .68rem; direction: ltr; unicode-bidi: isolate; }
.eyebrow { color: var(--gold); display: block; margin-bottom: 8px; }
.gold-text { background: var(--gold-foil); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; }

/* خط تزئینی با لوزی وسط؛ امضای بصری سایت */
.deco { display: flex; align-items: center; gap: 12px; color: var(--gold); margin-block: 10px 0; max-width: 260px; }
.deco::before, .deco::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold)); }
.deco::after { background: linear-gradient(270deg, transparent, var(--gold)); }
.deco i { width: 7px; height: 7px; background: var(--gold); transform: rotate(45deg); flex: none; }

/* ---------- دکمه‌ها ---------- */
.btn {
  position: relative; overflow: hidden;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--line); background: var(--raised); color: var(--ink);
  padding: 8px 18px; border-radius: var(--radius); font-weight: 500; text-decoration: none; white-space: nowrap;
  transition: border-color .2s, color .2s, transform .2s var(--ease), box-shadow .2s;
}
.btn:hover { border-color: var(--gold); color: var(--gold-hi); }
.btn:active { transform: translateY(1px) scale(.985); }
.btn.primary { background: var(--gold-foil); background-size: 200% 100%; color: var(--on-gold); border-color: transparent; font-weight: 600; }
.btn.primary:hover { color: var(--on-gold); box-shadow: var(--glow); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); border-color: rgb(240 120 106 / .5); background: transparent; }
.btn.sm { padding: 4px 12px; font-size: .85rem; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
.btn[data-armed] { background: var(--bad); color: var(--on-gold); border-color: var(--bad); }
.btn[aria-busy="true"] { opacity: .65; pointer-events: none; }

/* ---------- فرم‌ها ---------- */
.form { display: flex; flex-direction: column; gap: 12px; }
.frow { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: .82rem; color: var(--muted); }
.field input, .field select, .field textarea, .inp {
  width: 100%; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 8px 12px; transition: border-color .2s, box-shadow .2s;
}
.field input:focus, .field select:focus, .field textarea:focus, .inp:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); outline: none; }
.field textarea { resize: vertical; min-height: 64px; }
.check { display: flex; gap: 8px; align-items: center; }
.check input { accent-color: var(--gold); width: 16px; height: 16px; }
.ferr { color: var(--bad); font-size: .88rem; font-weight: 500; margin: 0; }
.ferr:empty { display: none; }
[aria-invalid="true"] { border-color: var(--bad) !important; box-shadow: 0 0 0 3px var(--bad-soft) !important; }

.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--bg); }
.seg button { border: 0; background: transparent; padding: 7px 16px; transition: background .2s, color .2s; }
.seg button[aria-pressed="true"] { background: var(--gold); color: var(--on-gold); font-weight: 600; }

.step { display: inline-flex; align-items: center; border: 1px solid var(--gold-lo); border-radius: var(--radius); background: var(--bg); }
.step button { border: 0; background: transparent; width: 32px; height: 32px; font-size: 1.1rem; line-height: 1; color: var(--gold); }
.step button:hover { color: var(--gold-hi); }
.step b { min-width: 26px; text-align: center; font-weight: 600; }

/* ---------- برچسب‌ها و حالت خالی ---------- */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 10px; border-radius: 99px; font-size: .78rem; font-weight: 500; white-space: nowrap; background: var(--gold-soft); color: var(--gold-hi); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--info-soft); color: var(--info); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); }
.note-box { background: var(--gold-soft); border: 1px solid rgb(212 175 106 / .25); border-radius: var(--radius); padding: 8px 14px; font-size: .85rem; }

/* ---------- تصویر آیتم ---------- */
.pic { position: relative; display: block; width: 100%; aspect-ratio: 4 / 3; overflow: hidden; background: var(--raised); }
.pic svg, .pic img { display: block; width: 100%; height: 100%; object-fit: cover; }
/* عکس واقعی روی تصویرسازی می‌نشیند */
.pic img { position: absolute; inset: 0; }
.thumb { width: 52px; flex: none; border-radius: 3px; border: 1px solid var(--line); }

/* ---------- کشو، پنجره و پیام ---------- */
.scrim { position: fixed; inset: 0; background: var(--scrim); backdrop-filter: blur(3px); z-index: 40; display: flex; }
.scrim.center { align-items: center; justify-content: center; padding: 16px; }
.drawer {
  margin-inline-start: auto; width: min(430px, 100%); height: 100%; display: flex; flex-direction: column;
  background: var(--surface); border-inline-start: 1px solid var(--gold-lo); box-shadow: var(--shadow);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.drawer header, .modal header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.drawer header h3, .modal header h3 { font-size: 1.6rem; color: var(--gold-hi); }
.drawer .scroll { flex: 1; overflow: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 16px; }
.modal { background: var(--surface); border: 1px solid var(--gold-lo); border-radius: var(--radius); width: min(560px, 100%); max-height: 100%; overflow: auto; box-shadow: var(--shadow); }
.modal.wide { width: min(720px, 100%); }
.modal .mbody { padding: 18px; }
.x { border: 0; background: none; font-size: 1.5rem; line-height: 1; padding: 2px 8px; color: var(--muted); }
.x:hover { color: var(--gold-hi); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions.center { justify-content: center; margin-top: 16px; }

.line { display: flex; gap: 10px; align-items: center; }
.line .t { flex: 1; min-width: 0; }
.line .t b { display: block; font-weight: 600; line-height: 1.4; }
.sums { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; font-size: .92rem; }
.sums .tot { font-weight: 700; font-size: 1.1rem; border-top: 1px solid var(--line); padding-top: 6px; margin-top: 4px; color: var(--gold-hi); }

#toast { position: fixed; inset-block-end: calc(20px + env(safe-area-inset-bottom, 0px)); inset-inline: 0; display: flex; justify-content: center; pointer-events: none; z-index: 60; padding-inline: 16px; }
#toast div { background: var(--raised); color: var(--ink); border: 1px solid var(--gold); padding: 8px 20px; border-radius: 99px; box-shadow: var(--shadow); }

/* ---------- فیش ---------- */
.receipt { background: var(--paper); color: var(--paper-ink); width: min(320px, 100%); margin-inline: auto; padding: 18px 16px; font-size: .82rem; line-height: 1.7; font-variant-numeric: tabular-nums; }
.receipt .c { text-align: center; }
.receipt h4 { font-family: var(--f-display); font-size: 1.7rem; font-weight: 700; line-height: 1; }
.receipt hr { border: 0; border-top: 1px dashed var(--paper-ink); margin: 8px 0; }
.receipt table { width: 100%; border-collapse: collapse; }
.receipt th { font-weight: 500; text-align: start; border-bottom: 1px solid var(--paper-ink); font-size: .74rem; }
.receipt td, .receipt th { padding: 2px 0; }
.receipt td:not(:first-child), .receipt th:not(:first-child) { text-align: end; padding-inline-start: 8px; white-space: nowrap; }
.receipt .r { display: flex; justify-content: space-between; gap: 12px; }
.receipt .big { font-size: 1.05rem; font-weight: 700; }
#print { display: none; }
@media print {
  body { background: #fff; }
  body > *:not(#print) { display: none !important; }
  #print { display: block !important; }
  .receipt { width: 72mm; }
}

/* سایت مشتری: سربرگ، صحنه اصلی، منو، داستان، رزرو و پابرگ. */

/* ---------- سربرگ ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgb(10 9 7 / .82); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 18px; min-height: var(--header-height); }
.mark { display: flex; align-items: center; gap: 12px; text-decoration: none; }
.monogram { width: 40px; height: 40px; display: grid; place-items: center; flex: none; border: 1px solid var(--gold); transform: rotate(45deg); }
.monogram b { transform: rotate(-45deg); font-family: var(--f-display); font-size: 1.5rem; font-weight: 700; color: var(--gold-hi); line-height: 1; }
.mark .names { display: flex; flex-direction: column; line-height: 1.1; }
.mark .names b { font-family: var(--f-display); font-size: 1.6rem; font-weight: 700; }
.mark .names .latin { font-size: .52rem; color: var(--gold); }
.nav { display: flex; gap: 4px; margin-inline-start: auto; }
.nav button { position: relative; border: 0; background: none; padding: 6px 12px; color: var(--ink); }
.nav button::after { content: ''; position: absolute; inset-inline: 12px; bottom: 2px; height: 1px; background: var(--gold); transform: scaleX(0); transition: transform .3s var(--ease); }
.nav button:hover { color: var(--gold-hi); }
.nav button:hover::after { transform: scaleX(1); }
.cartbtn .n { background: var(--on-gold); color: var(--gold-hi); border-radius: 99px; min-width: 22px; height: 22px; display: inline-grid; place-items: center; font-size: .8rem; font-weight: 700; }
@media (max-width: 860px) { .nav { display: none; } .top .wrap { justify-content: space-between; } .mark .names .latin { display: none; } }

/* ---------- صحنه اصلی ---------- */
.hero { position: relative; overflow: hidden; border-bottom: 1px solid var(--line); background: radial-gradient(600px 420px at var(--mx, 25%) var(--my, 40%), rgb(212 175 106 / .13), transparent 70%); }
.hero .dust { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.hero-in { position: relative; display: grid; grid-template-columns: 1.05fr .95fr; gap: 40px; align-items: center; padding-block: 64px 76px; }
.hero h1 { font-size: clamp(3rem, 7vw, 5.6rem); font-weight: 700; }
.hero h1 span { display: block; }
.hero p { max-width: 46ch; margin-top: 18px; color: var(--muted); font-size: 1.04rem; }
.hero .cta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 28px; }
.hero .cta .btn { padding: 11px 24px; }

.stage { position: relative; width: min(100%, 460px); aspect-ratio: 1; margin-inline: auto; min-width: 0; }
.stage > * { position: absolute; }
.stage .rays, .stage .ring-text { inset: 0; width: 100%; height: 100%; }
.stage .ring-text text { font-family: var(--f-latin); font-size: 10.5px; letter-spacing: .34em; fill: var(--gold); }
.stage .cup { inset: 17%; border-radius: 50%; overflow: hidden; border: 1px solid var(--gold); box-shadow: 0 0 0 8px var(--bg), 0 0 0 9px var(--gold-lo), 0 30px 80px rgb(0 0 0 / .7); }
.stage .cup .pic { aspect-ratio: 1; height: 100%; }
.stage .steam { inset: -4% 30% auto; width: 40%; height: 46%; pointer-events: none; }

/* برگه عصاره‌گیری: زمان‌سنج زنده یک شات اسپرسو */
.shot { inset-block-end: -4%; inset-inline-start: -6%; width: 216px; background: rgb(18 16 12 / .92); backdrop-filter: blur(8px); border: 1px solid var(--gold-lo); padding: 14px 16px; font-size: .82rem; line-height: 1.7; box-shadow: var(--shadow); }
.shot h4 { font-family: var(--f-display); font-size: 1.15rem; font-weight: 600; color: var(--gold-hi); display: flex; justify-content: space-between; align-items: center; }
.shot .live { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.shot dl { margin: 6px 0 8px; display: grid; grid-template-columns: auto 1fr; gap: 0 14px; }
.shot dt { color: var(--muted); }
.shot dd { margin: 0; text-align: end; }
.shot .clock { display: flex; align-items: baseline; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 8px; }
.shot .clock b { font-size: 1.7rem; font-weight: 700; line-height: 1; color: var(--gold-hi); }
.shot .bar { height: 3px; background: var(--line); margin-top: 8px; overflow: hidden; }
.shot .bar i { display: block; height: 100%; width: 100%; background: var(--gold-foil); transform-origin: right; }
@media (max-width: 860px) {
  .hero-in { grid-template-columns: 1fr; padding-block: 40px 64px; }
  .stage { max-width: 340px; margin-bottom: 96px; }
  .shot { inset-inline-start: 0; inset-block-end: -30%; width: 196px; }
}

/* نوار متحرک زیر صحنه */
.marquee { overflow: hidden; border-bottom: 1px solid var(--line); background: var(--surface); padding-block: 10px; direction: ltr; }
.marquee .track { display: flex; width: max-content; }
.marquee span { direction: rtl; white-space: nowrap; padding-inline: 22px; font-family: var(--f-display); font-size: 1.25rem; color: var(--gold); }
.marquee span::after { content: '◆'; font-size: .6rem; margin-inline-start: 44px; vertical-align: middle; color: var(--gold-lo); }

/* ---------- بخش‌ها ---------- */
.sec { padding-block: 64px; }
.sec-h { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 26px; }
.sec-h h2 { font-size: clamp(2.2rem, 4.4vw, 3.2rem); }
.sec-h > p { max-width: 52ch; font-size: .9rem; }

/* انتخاب‌های ما: قاب‌های طاق‌دار */
.sigs { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 22px; }
.sig { border: 0; background: none; padding: 0; text-align: start; display: flex; flex-direction: column; gap: 8px; color: var(--ink); }
.sig .frame { position: relative; border-radius: 999px 999px var(--radius) var(--radius); overflow: hidden; border: 1px solid var(--gold-lo); transition: border-color .3s, box-shadow .4s; }
.sig .pic { aspect-ratio: 4 / 4.8; transition: transform .7s var(--ease); }
.sig:hover .frame { border-color: var(--gold-hi); box-shadow: var(--glow); }
.sig:hover .pic { transform: scale(1.07); }
.sig h3 { font-size: 1.5rem; }
.sig .add-hint { position: absolute; inset-inline: 0; bottom: 0; padding: 22px 10px 10px; text-align: center; font-size: .85rem; color: var(--gold-hi); background: linear-gradient(transparent, rgb(0 0 0 / .85)); opacity: 0; transform: translateY(8px); transition: opacity .3s, transform .3s var(--ease); }
.sig:hover .add-hint, .sig:focus-visible .add-hint { opacity: 1; transform: none; }

/* منو */
.tools { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; flex: 1 1 320px; min-width: 0; scrollbar-width: thin; }
.tabs button { border: 1px solid var(--line); background: transparent; color: var(--ink); padding: 5px 16px; border-radius: 99px; white-space: nowrap; transition: border-color .2s, background .2s, color .2s; }
.tabs button:hover { border-color: var(--gold); }
.tabs button[aria-pressed="true"] { background: var(--gold); color: var(--on-gold); border-color: var(--gold); font-weight: 600; }
.search { flex: 0 1 240px; }
.cat-h { display: flex; align-items: baseline; gap: 14px; margin: 38px 0 16px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.cat-h h3 { font-size: 1.9rem; color: var(--gold-hi); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
.card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; transition: transform .35s var(--ease), border-color .3s, box-shadow .35s; }
.card:hover { transform: translateY(-5px); border-color: var(--gold-lo); box-shadow: var(--shadow); }
.card .pic { transition: transform .7s var(--ease); }
.card:hover .pic { transform: scale(1.05); }
.card.off { opacity: .5; }
.card .media { overflow: hidden; border-bottom: 1px solid var(--line); }
.card .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.card h4 { font-family: var(--f-display); font-size: 1.45rem; font-weight: 600; line-height: 1.2; }
.card .en { color: var(--gold-lo); font-size: .56rem; }
.card .desc { color: var(--muted); font-size: .88rem; line-height: 1.7; }
.lab { font-size: .76rem; border: 1px dashed var(--gold-lo); color: var(--gold); padding: 1px 8px; border-radius: 2px; align-self: flex-start; }
.card .foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; padding-top: 10px; }
.price { font-weight: 700; font-size: 1.02rem; color: var(--gold-hi); }

/* داستان ما */
.story { background: var(--surface); border-block: 1px solid var(--line); }
.story .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 32px; }
.story .fact { border-inline-start: 1px solid var(--gold-lo); padding-inline-start: 18px; }
.story .big { font-family: var(--f-display); font-size: 4.2rem; font-weight: 700; line-height: 1; }
.story .big small { font-size: 1.2rem; opacity: 1; color: var(--gold); -webkit-text-fill-color: var(--gold); }
.story h3 { font-size: 1.5rem; margin-block: 6px; }
.story p { color: var(--muted); }

/* رزرو و تماس */
.book { display: grid; grid-template-columns: 1.2fr .8fr; gap: 28px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; min-width: 0; }
.book h2 { font-size: 2.3rem; margin-bottom: 14px; }
.info dl { margin: 0; display: grid; gap: 12px; }
.info dt { font-size: .8rem; color: var(--muted); }
.info dd { margin: 0; font-weight: 500; }
@media (max-width: 860px) { .book { grid-template-columns: 1fr; } }

.iglink { display: inline-flex; align-items: center; gap: 7px; text-decoration: none; font-weight: 500; color: var(--gold); transition: color .2s; }
.iglink:hover { color: var(--gold-hi); }

.foot-site { border-top: 1px solid var(--gold-lo); background: var(--bg); padding-block: 28px; }
.foot-site .wrap { display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.foot-site .acts { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }

/* ---------- پیگیری سفارش ---------- */
.steps { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-block: 22px 16px; }
.steps::before, .steps::after { content: ''; position: absolute; top: 6px; inset-inline: 12.5%; height: 2px; background: var(--line); }
.steps::after { background: var(--gold-foil); transform-origin: right; transform: scaleX(var(--progress, 0)); transition: transform .8s var(--ease); }
.steps div { position: relative; z-index: 1; text-align: center; font-size: .8rem; color: var(--muted); padding-top: 22px; }
.steps div::before { content: ''; position: absolute; top: 0; inset-inline-start: calc(50% - 7px); width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line); }
.steps div.on { color: var(--ink); font-weight: 600; }
.steps div.on::before { background: var(--gold); border-color: var(--gold-hi); }

/* پنل کارکنان: سفارش‌گیری، آشپزخانه و بار، مدیریت. فشرده‌تر و ابزاری‌تر از سایت مشتری. */
.sbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgb(10 9 7 / .9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--gold-lo); }
.sbar .in { display: flex; align-items: center; gap: 14px; padding: 8px 16px; flex-wrap: wrap; }
.sbar .monogram { width: 30px; height: 30px; }
.sbar .monogram b { font-size: 1.1rem; }
.sbar .mark .names b { font-size: 1.3rem; }
.stabs { display: flex; gap: 4px; flex: 1; min-width: 0; overflow-x: auto; }
.stabs button { border: 0; background: transparent; color: var(--muted); padding: 7px 14px; border-radius: var(--radius); white-space: nowrap; transition: color .2s, background .2s; }
.stabs button:hover { color: var(--ink); }
.stabs button[aria-pressed="true"] { background: var(--gold-soft); color: var(--gold-hi); font-weight: 600; }
.sbar .clock { margin-inline-start: auto; color: var(--muted); }
.mode-tag { font-size: .72rem; }
@media (max-width: 700px) { .stabs { order: 5; flex-basis: 100%; } .sbar .clock { display: none; } .sbar .mode-tag { margin-inline-start: auto; } }

.smain { padding: 18px 16px 60px; max-width: 1400px; margin-inline: auto; }
.h-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.h-row h2 { font-size: 2rem; }
.h-row.tight { margin: 0; }

.login { max-width: 380px; margin: 8vh auto; background: var(--surface); border: 1px solid var(--gold-lo); border-radius: var(--radius); padding: 28px; box-shadow: var(--shadow); }
.login h2 { font-size: 2.2rem; margin-bottom: 4px; }

/* ---------- سالن ---------- */
.zone { margin-bottom: 22px; }
.zone h3 { font-size: 1.3rem; margin-bottom: 8px; color: var(--muted); }
.floor { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
.tbl { border: 1px solid var(--line); border-top: 4px solid var(--ok); background: var(--surface); color: var(--ink); border-radius: var(--radius); padding: 10px 12px; text-align: start; display: flex; flex-direction: column; gap: 2px; min-height: 104px; transition: transform .25s var(--ease), border-color .2s, box-shadow .25s; }
.tbl:hover { transform: translateY(-3px); border-color: var(--gold); box-shadow: var(--shadow); }
.tbl b { font-family: var(--f-display); font-size: 1.8rem; line-height: 1; }
.tbl.busy { border-top-color: var(--bad); }
.tbl.bill { border-top-color: var(--warn); }
.tbl.res { border-top-color: var(--info); }
.tbl .s { font-size: .78rem; color: var(--muted); }
.tbl .amount { font-weight: 600; color: var(--gold-hi); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .82rem; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-inline-end: 5px; vertical-align: -1px; }

/* ---------- ثبت سفارش ---------- */
.pos { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; }
.picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; margin-top: 12px; }
.pick { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: var(--radius); padding: 8px; text-align: start; min-width: 0; transition: border-color .2s, transform .2s var(--ease); }
.pick:hover:not(:disabled) { border-color: var(--gold); transform: translateY(-2px); }
.pick:disabled { opacity: .45; cursor: not-allowed; }
.pick span { min-width: 0; display: flex; flex-direction: column; line-height: 1.45; }
.pick b { font-weight: 600; font-size: .9rem; }
.pick small { opacity: 1; color: var(--gold); }
.ticket { background: var(--surface); border: 1px solid var(--gold-lo); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 12px; position: sticky; top: calc(64px + env(safe-area-inset-top, 0px)); }
.ticket h3 { font-size: 1.6rem; color: var(--gold-hi); }
.tl { display: flex; flex-direction: column; gap: 8px; max-height: 44vh; overflow: auto; }
.ti { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.ti .note { grid-column: 1 / -1; font-size: .82rem; padding: 3px 8px; }
.ti .line-note { color: var(--warn); }
.pay { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (max-width: 980px) { .pos { grid-template-columns: 1fr; } .ticket { position: static; } }

/* ---------- آشپزخانه و بار ---------- */
.kds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
.kcol { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 160px; }
.kcol > h3 { font-size: 1.4rem; display: flex; justify-content: space-between; align-items: center; }
.kt { background: var(--raised); border: 1px solid var(--line); border-inline-start: 4px solid var(--info); border-radius: var(--radius); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.kt.late { border-inline-start-color: var(--bad); }
.kt .hd { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.kt ul { margin: 0; padding: 0; list-style: none; }
.kt li { display: flex; gap: 8px; font-weight: 500; }
.kt li i { font-style: normal; color: var(--warn); font-weight: 400; font-size: .85rem; }
@media (max-width: 860px) { .kds { grid-template-columns: 1fr; } }

/* ---------- مدیریت ---------- */
.atabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
.atabs button { border: 0; background: none; padding: 8px 14px; border-bottom: 2px solid transparent; white-space: nowrap; color: var(--muted); transition: color .2s, border-color .2s; }
.atabs button:hover { color: var(--ink); }
.atabs button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold-hi); font-weight: 600; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-block: 14px 16px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.kpi > span { font-size: .82rem; color: var(--muted); }
.kpi b { display: block; font-size: 1.7rem; font-weight: 700; line-height: 1.4; color: var(--gold-hi); }
.panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
.panel h3 { font-size: 1.4rem; margin-bottom: 2px; }
.panel.narrow { max-width: 720px; }
.bars { display: flex; align-items: flex-end; gap: 5px; height: 170px; margin-top: 14px; border-bottom: 1px solid var(--line); }
.bar { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; min-width: 0; gap: 3px; }
.bar i { display: block; width: 100%; max-width: 38px; background: linear-gradient(var(--gold-hi), var(--gold-lo)); border-radius: 2px 2px 0 0; min-height: 1px; transform-origin: bottom; }
.bar .v { font-size: .7rem; color: var(--muted); white-space: nowrap; }
.xl { display: flex; gap: 5px; margin-top: 4px; }
.xl span { flex: 1; text-align: center; font-size: .7rem; color: var(--muted); min-width: 0; overflow: hidden; }
.rank { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.rank .r { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: .9rem; }
.rank .r u { grid-column: 1 / -1; display: block; height: 4px; background: var(--gold-foil); border-radius: 2px; text-decoration: none; transform-origin: right; }
.tw { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
table.t { width: 100%; border-collapse: collapse; font-size: .9rem; }
table.t th { font-weight: 500; color: var(--gold); font-size: .8rem; text-align: start; background: var(--bg); }
table.t th, table.t td { padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
table.t td.w { white-space: normal; min-width: 180px; }
table.t tr:last-child td { border-bottom: 0; }
table.t tbody tr { transition: background .2s; }
table.t tbody tr:hover { background: var(--gold-soft); }
.imgrow { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.imgrow .pic { width: 120px; border-radius: var(--radius); flex: none; border: 1px solid var(--line); }
.imgrow .form { flex: 1; min-width: 200px; }
.stack { display: flex; flex-direction: column; gap: 14px; }

/*
 * لایه شیشه‌ای. این فایل بعد از site.css و staff.css بار می‌شود و فقط جنس سطح‌ها را عوض می‌کند:
 * زمینه نیمه‌شفاف، لبه روشن، برق باریک بالای هر سطح و نورهای محو پشت صفحه که از شیشه دیده می‌شوند.
 * برای برگشتن به سطح‌های مات کافی است همین فایل از index.html برداشته شود.
 */
:root {
  --glass: rgb(255 240 205 / .055);
  --glass-hover: rgb(255 240 205 / .09);
  --glass-deep: rgb(16 14 10 / .62);
  --glass-line: rgb(246 227 168 / .16);
  --glass-shine: inset 0 1px 0 rgb(255 255 255 / .1), inset 0 0 0 1px rgb(255 255 255 / .025);
  --frost: blur(20px) saturate(150%);
  --field: rgb(0 0 0 / .32);
}

/* ---------- نورهای محیطی ---------- */
/* سه لکه نور بزرگ و محو، ثابت پشت صفحه؛ شیشه بدون چیزی در پشتش فقط یک مستطیل خاکستری است. */
body::before, body::after, #app::before {
  content: ''; position: fixed; z-index: -1; pointer-events: none;
  width: 56vmax; height: 56vmax; border-radius: 50%; filter: blur(90px);
}
body::before { top: -20vmax; inset-inline-start: -14vmax; background: radial-gradient(circle, rgb(212 175 106 / .34), transparent 66%); }
body::after { bottom: -24vmax; inset-inline-end: -16vmax; background: radial-gradient(circle, rgb(176 96 44 / .3), transparent 66%); }
#app::before { top: 34%; inset-inline-start: 38%; width: 40vmax; height: 40vmax; background: radial-gradient(circle, rgb(246 227 168 / .13), transparent 66%); }

/* ---------- سطح‌های درون صفحه ---------- */
/*
 * پشت این سطح‌ها فقط نورهای از پیش محوشده است، پس نیمه‌شفافیِ ساده همان ظاهر شیشه مات را می‌دهد
 * و backdrop-filter (که روی ده‌ها کارت هنگام اسکرول سنگین است) لازم نیست.
 */
.card, .panel, .kpi, .kcol, .tbl, .pick, .tw, .login, .story, .marquee, .note-box, .empty {
  background: var(--glass);
  border-color: var(--glass-line);
  box-shadow: var(--glass-shine);
}
.kt { background: var(--glass-hover); border-color: var(--glass-line); box-shadow: var(--glass-shine); }
/* نوار رنگیِ وضعیت روی میزها و برگه‌های آشپزخانه باید از لبه شیشه‌ای مستثنا بماند */
.tbl { border-top-color: var(--ok); }
.kt { border-inline-start-color: var(--info); }
.card:hover { background: var(--glass-hover); border-color: var(--gold-lo); box-shadow: var(--glass-shine), var(--shadow); }
.tbl:hover, .pick:hover:not(:disabled) { background: var(--glass-hover); box-shadow: var(--glass-shine), var(--shadow); }
.story { border-color: var(--glass-line); }
.card .media, .cat-h, .atabs, table.t th, table.t td, .ti { border-color: var(--glass-line); }
table.t th { background: rgb(0 0 0 / .28); }

/* بازتاب مورب نور روی گوشه بالای شیشه */
.card::after, .kpi::after, .tbl::after, .panel::after, .login::after {
  content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(135deg, rgb(255 255 255 / .08), transparent 34%);
}
.kpi, .tbl, .panel, .login { position: relative; }

.tabs button, .seg, .step, .btn:not(.primary):not([data-armed]) { background: var(--glass); border-color: var(--glass-line); }
.btn:not(.primary):not([data-armed]):hover { background: var(--glass-hover); border-color: var(--gold); }
.tabs button[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); }
.field input, .field select, .field textarea, .inp { background: var(--field); border-color: var(--glass-line); }
.pill { box-shadow: inset 0 0 0 1px rgb(255 255 255 / .06); }

/* ---------- سطح‌های شناور روی محتوا ---------- */
/* این‌ها روی عکس‌ها و متن می‌نشینند، پس تار کردنِ واقعیِ پشتشان لازم است. */
@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .top, .sbar, .drawer, .modal, .shot, .ticket, #toast div, .sig .add-hint {
    -webkit-backdrop-filter: var(--frost);
    backdrop-filter: var(--frost);
  }
  .top, .sbar { background: rgb(10 9 7 / .5); border-color: var(--glass-line); }
  .drawer, .modal { background: var(--glass-deep); box-shadow: var(--glass-shine), var(--shadow); }
  .shot { background: rgb(22 19 13 / .5); border-color: rgb(246 227 168 / .3); box-shadow: var(--glass-shine), var(--shadow); }
  .ticket { background: rgb(22 19 13 / .5); box-shadow: var(--glass-shine), var(--shadow); }
  #toast div { background: rgb(26 23 17 / .6); }
  .scrim { background: rgb(0 0 0 / .5); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
}

/* فیش کاغذ است، نه شیشه */
.receipt { box-shadow: 0 10px 40px rgb(0 0 0 / .5); }

/*
 * همه حرکت‌ها یک‌جا. هر انیمیشن از حالت نهاییِ دیده‌شدنی شروع نمی‌شود مگر با کلاس یا رویداد؛
 * اگر جاوااسکریپت یا انیمیشن غیرفعال باشد، صفحه کامل و خوانا می‌ماند.
 */

/* ---------- پرده ورود: حلقه طلایی که یک بار رسم می‌شود و کنار می‌رود ---------- */
.preloader { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: var(--bg); pointer-events: none; animation: curtain .5s .9s var(--ease) forwards; }
.preloader svg { width: 96px; height: 96px; }
.preloader circle { fill: none; stroke: var(--gold); stroke-width: 1.5; stroke-dasharray: 290; stroke-dashoffset: 290; animation: draw .9s var(--ease) forwards; }
.preloader text { font-family: var(--f-display); font-size: 40px; font-weight: 700; fill: var(--gold-hi); opacity: 0; animation: fade-in .5s .3s forwards; }
@keyframes curtain { to { opacity: 0; visibility: hidden; } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fade-in { to { opacity: 1; } }

/* ---------- نورهای محیطی پشت شیشه: خیلی آرام جابه‌جا می‌شوند ---------- */
body::before { animation: drift-a 26s ease-in-out infinite alternate; }
body::after { animation: drift-b 32s ease-in-out infinite alternate; }
@keyframes drift-a { to { transform: translate(-8vmax, 10vmax) scale(1.15); } }
@keyframes drift-b { to { transform: translate(10vmax, -8vmax) scale(.9); } }

/* ---------- صحنه اصلی ---------- */
.shimmer { animation: shimmer 6s linear infinite; }
@keyframes shimmer { to { background-position: -220% 0; } }

.hero-copy > * { animation: rise .9s var(--ease) both; }
.hero-copy > :nth-child(1) { animation-delay: 1.0s; }
.hero-copy > :nth-child(2) { animation-delay: 1.1s; }
.hero-copy > :nth-child(3) { animation-delay: 1.25s; }
.hero-copy > :nth-child(4) { animation-delay: 1.4s; }
@keyframes rise { from { opacity: 0; transform: translateY(26px); } }

.stage .rays { animation: spin 90s linear infinite; }
.stage .ring-text { animation: spin 40s linear infinite reverse; }
@keyframes spin { to { transform: rotate(360deg); } }

.stage .cup { animation: float 7s ease-in-out infinite, pop 1s 1.1s var(--ease) both; }
@keyframes float { 50% { translate: 0 -10px; } }
@keyframes pop { from { opacity: 0; scale: .86; } }

.steam path { fill: none; stroke: rgb(246 227 168 / .5); stroke-width: 3; stroke-linecap: round; filter: blur(2.5px); stroke-dasharray: 60 140; animation: steam 4.5s linear infinite; }
.steam path:nth-child(2) { animation-delay: -1.5s; animation-duration: 5.5s; }
.steam path:nth-child(3) { animation-delay: -3s; animation-duration: 5s; }
@keyframes steam { from { stroke-dashoffset: 0; opacity: 0; } 20% { opacity: 1; } 80% { opacity: .5; } to { stroke-dashoffset: -200; opacity: 0; } }

.shot { animation: rise .9s 1.5s var(--ease) both; }
.shot .live { animation: blink 1.4s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .25; } }

.marquee .track { animation: marquee 38s linear infinite; }
.marquee:hover .track { animation-play-state: paused; }
@keyframes marquee { to { transform: translateX(-50%); } }

/* ---------- ظاهرشدن با اسکرول (فقط مرورگرهایی که انیمیشن وابسته به اسکرول دارند) ---------- */
@supports (animation-timeline: view()) {
  .reveal { animation: reveal linear both; animation-timeline: view(); animation-range: entry 0% entry 55%; }
  /* شروع از شفافیت کامل نیست تا در چاپ یا عکس تمام‌صفحه، بخش‌های پایین خالی دیده نشوند. */
  @keyframes reveal { from { opacity: .3; transform: translateY(36px) scale(.98); } }
}

/* ---------- ریزحرکت‌ها ---------- */
.btn.primary::after { content: ''; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 35%, rgb(255 255 255 / .55) 50%, transparent 65%); transform: translateX(120%); }
.btn.primary:hover::after { transform: translateX(-120%); transition: transform .7s var(--ease); }

.bump { animation: bump .45s var(--ease); }
@keyframes bump { 40% { transform: scale(1.18); } }

.fly-dot { position: fixed; z-index: 70; width: 18px; height: 18px; margin: -9px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, var(--gold-hi), var(--gold-lo)); box-shadow: 0 0 18px var(--gold); pointer-events: none; }

.scrim { animation: fade-in .25s both; }
.scrim.closing { animation: fade-out .2s both; }
.drawer { animation: slide-in .4s var(--ease) both; }
.modal { animation: modal-in .35s var(--ease) both; }
@keyframes fade-out { to { opacity: 0; } }
@keyframes slide-in { from { transform: translateX(-100%); } }
@keyframes modal-in { from { opacity: 0; transform: translateY(18px) scale(.97); } }

#toast div { animation: toast-in .35s var(--ease) both; }
@keyframes toast-in { from { opacity: 0; transform: translateY(14px); } }

/* فیش مثل بیرون‌آمدن از چاپگر، از بالا به پایین باز می‌شود */
.receipt.printing { animation: print-out 1.1s steps(22) both; }
@keyframes print-out { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0); } }

.steps div.now::before { animation: pulse 1.6s ease-out infinite; }
@keyframes pulse { from { box-shadow: 0 0 0 0 rgb(212 175 106 / .6); } to { box-shadow: 0 0 0 12px rgb(212 175 106 / 0); } }

/* ---------- پنل کارکنان: فقط هنگام عوض‌شدن زبانه ---------- */
.enter > * { animation: rise .45s var(--ease) both; }
.enter > :nth-child(2) { animation-delay: .05s; }
.enter > :nth-child(3) { animation-delay: .1s; }
.enter > :nth-child(n+4) { animation-delay: .15s; }
.enter .bar i { animation: grow-y .7s .2s var(--ease) both; }
.enter .rank u { animation: grow-x .7s .2s var(--ease) both; }
@keyframes grow-y { from { transform: scaleY(0); } }
@keyframes grow-x { from { transform: scaleX(0); } }
.kt.late .pill.bad { animation: blink 1.2s ease-in-out infinite; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .preloader { display: none; }
}
</style>
</head>
